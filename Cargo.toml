[package]
name = "toolforge"
version = "0.1.0"
edition = "2021"
description = "A small, policy-controlled JSONL tool harness for coding agents"
license = "MIT"
repository = "https://github.com/1363582823/toolforge"
readme = "README.md"
keywords = ["agent", "harness", "security", "tools", "jsonl"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.14"
